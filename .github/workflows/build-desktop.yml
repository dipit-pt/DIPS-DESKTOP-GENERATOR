name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nome da aplicação"
        required: true
        type: string
      app_url:
        description: "URL do website"
        required: true
        type: string
      windows:
        description: "Windows"
        type: boolean
        default: true
      macos:
        description: "macOS"
        type: boolean
        default: true
      linux:
        description: "Linux"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    permissions:
      contents: read
    name: Resolve application identity
    runs-on: ubuntu-24.04
    outputs:
      app_id: ${{ steps.identity.outputs.app_id }}
      app_version: ${{ steps.identity.outputs.app_version }}
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - name: Resolve selected platforms
        id: platforms
        shell: bash
        env:
          WINDOWS: ${{ inputs.windows }}
          MACOS: ${{ inputs.macos }}
          LINUX: ${{ inputs.linux }}
        run: |
          python3 - <<'PY'
          import json, os
          options = [
              ("WINDOWS", "windows-latest", "windows-x64", "windows"),
              ("MACOS", "macos-15", "macos-arm64", "macos"),
              ("LINUX", "ubuntu-24.04", "linux-x64", "linux"),
          ]
          selected = [{"os": runner, "target": target, "platform": platform}
                      for flag, runner, target, platform in options if os.environ[flag] == "true"]
          if not selected:
              raise SystemExit("Select at least one operating system")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps(selected, separators=(",", ":")) + "\n")
          print("Selected:", ", ".join(x["platform"] for x in selected))
          PY

      - name: Derive identifier and automatic version
        id: identity
        shell: bash
        env:
          APP_URL: ${{ inputs.app_url }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import ipaddress
          import os
          from urllib.parse import urlsplit

          url = urlsplit(os.environ["APP_URL"])
          if url.scheme not in ("http", "https") or not url.hostname:
              raise SystemExit("Please enter a valid HTTP(S) URL")
          host = url.hostname.lower().rstrip(".")
          try:
              ipaddress.ip_address(host)
              raise SystemExit("Use a domain name rather than an IP address")
          except ValueError as exc:
              if str(exc) == "Use a domain name rather than an IP address":
                  raise
          labels = host.split(".")
          if len(labels) < 2 or any(not label or not label.replace("-", "").isalnum() or label[0] == "-" or label[-1] == "-" for label in labels):
              raise SystemExit("Invalid domain name for application identifier")
          app_id = ".".join(reversed(labels))
          version = f"1.0.{os.environ['RUN_NUMBER']}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"app_id={app_id}\n")
              output.write(f"app_version={version}\n")
          print(f"App ID: {app_id}; version: {version}")
          PY

  build:
    permissions:
      contents: read
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      APP_NAME: ${{ inputs.app_name }}
      APP_URL: ${{ inputs.app_url }}
      APP_ID: ${{ needs.prepare.outputs.app_id }}
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Generate build-specific settings
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const url = new URL(process.env.APP_URL);
            if (!["http:", "https:"].includes(url.protocol)) throw new Error("APP_URL must be HTTP(S)");
            if (!process.env.APP_NAME.trim()) throw new Error("APP_NAME is required");
            if (!/^[a-zA-Z][a-zA-Z0-9]*(\.[a-zA-Z][a-zA-Z0-9-]*)+$/.test(process.env.APP_ID)) throw new Error("Invalid APP_ID");
            fs.writeFileSync("src/settings.ts",
              "export const APP_URL = " + JSON.stringify(url.toString()) + ";\n" +
              "export const APP_TITLE = " + JSON.stringify(process.env.APP_NAME) + ";\n");
          '

      - name: Install Hutch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://hutch.blackboard.sh/hutch/install.ps1)))

      - name: Add Hutch to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hutchBin = Join-Path $HOME ".hutch\bin"
          if (-not (Test-Path (Join-Path $hutchBin "hutch.exe"))) {
            throw "Hutch executable not found in $hutchBin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $hutchBin

      - name: Install Hutch (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcode-select -p
          brew install cmake
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh

      - name: Add Hutch to PATH (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"

      - name: Install Hutch and desktop libraries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libnotify-bin
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"

      - name: Verify Hutch
        shell: bash
        run: |
          command -v hutch
          hutch --version

      - name: Build
        shell: bash
        run: hutch electrobun build --env=stable

      - name: Sign, verify and package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-ready
          app_path="$(find build dist artifacts -type d -name '*.app' -print -prune 2>/dev/null | head -n 1 || true)"
          if [ -z "$app_path" ]; then
            echo "::error::No macOS .app bundle found in build, dist or artifacts"
            exit 1
          fi
          echo "Signing bundle: $app_path"
          codesign --force --deep --sign - "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "release-ready/macos-arm64.zip"
          mkdir -p verify-extracted
          ditto -x -k "release-ready/macos-arm64.zip" verify-extracted
          extracted="$(find verify-extracted -type d -name '*.app' -print -prune | head -n 1)"
          test -n "$extracted"
          codesign --verify --deep --strict --verbose=2 "$extracted"

      - name: Upload output
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}-${{ github.run_id }}
          path: |
            ${{ runner.os == 'macOS' && 'release-ready/macos-arm64.zip' || 'build/**' }}
            ${{ runner.os != 'macOS' && 'dist/**' || '' }}
            ${{ runner.os != 'macOS' && 'artifacts/**' || '' }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish named release
    needs: [prepare, build]
    if: ${{ success() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      APP_NAME: ${{ inputs.app_name }}
      APP_URL: ${{ inputs.app_url }}
      APP_ID: ${{ needs.prepare.outputs.app_id }}
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download Windows artifact
        if: ${{ inputs.windows }}
        uses: actions/download-artifact@v8
        with:
          name: desktop-windows-x64-${{ github.run_id }}
          path: release-files/windows-x64

      - name: Download macOS artifact
        if: ${{ inputs.macos }}
        uses: actions/download-artifact@v8
        with:
          name: desktop-macos-arm64-${{ github.run_id }}
          path: release-files/macos-arm64

      - name: Download Linux artifact
        if: ${{ inputs.linux }}
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux-x64-${{ github.run_id }}
          path: release-files/linux-x64

      - name: Package downloads and write release notes
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import zipfile

          root = pathlib.Path("release-files")
          archives = pathlib.Path("release-packages")
          archives.mkdir(exist_ok=True)
          folders = sorted(p for p in root.iterdir() if p.is_dir() and p.name in ("windows-x64", "macos-arm64", "linux-x64")) if root.exists() else []
          if not folders:
              raise SystemExit(f"No downloaded desktop artifacts in {root}; entries: {list(root.iterdir()) if root.exists() else 'missing directory'}")
          slug = re.sub(r"[^a-z0-9-]+", "-", os.environ["APP_NAME"].lower()).strip("-") or "desktop-app"
          for folder in folders:
              platform = folder.name
              if platform is None:
                  raise SystemExit(f"Unknown artifact platform: {folder.name}")
              files = [p for p in folder.rglob("*") if p.is_file()]
              if not files:
                  raise SystemExit(f"Empty artifact: {folder.name}")
              archive = archives / f"{slug}-v{os.environ['APP_VERSION']}-{platform}.zip"
              if platform == "macos-arm64":
                  source = folder / "macos-arm64.zip"
                  if not source.is_file():
                      raise SystemExit(f"Missing macOS ditto archive in {folder.name}")
                  import shutil
                  shutil.copy2(source, archive)
              else:
                  with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as zf:
                      for file in files:
                          zf.write(file, file.relative_to(folder))
              print(f"Packaged {folder.name} -> {archive}")
          pathlib.Path("release-notes.md").write_text(
              f"## {os.environ['APP_NAME']}\n\n"
              f"**Version:** `{os.environ['APP_VERSION']}`  \n"
              f"**App ID:** `{os.environ['APP_ID']}`  \n"
              f"**Website:** {os.environ['APP_URL']}  \n"
              f"**Build:** #{os.environ['GITHUB_RUN_NUMBER']}\n\n"
              "Download the archive for your operating system from **Assets** below.\n\n"
              "> Builds may be unsigned. Verify them before external distribution.\n"
          )
          PY

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ github.run_id }}
        run: |
          tag="${APP_ID}-v${APP_VERSION}-run${BUILD_RUN}"
          gh release create "$tag" release-packages/*.zip \
            --target "${GITHUB_SHA}" \
            --title "${APP_NAME} | v${APP_VERSION}" \
            --notes-file release-notes.md \
            --latest=false
