name: DIPIT Desktop Apps
on:
  workflow_dispatch:
    inputs:
      name: {description: Nome, required: true, type: string}
      url: {description: Endereco URL, required: true, type: string}
      image: {description: Endereco Imagem, required: false, type: string}
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: desktop-apps
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.register.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Register apps
        id: register
        env:
          EVENT: ${{ github.event_name }}
          NAME: ${{ inputs.name }}
          URL: ${{ inputs.url }}
          IMAGE: ${{ inputs.image }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,re
          from urllib.parse import urlsplit
          file=pathlib.Path('apps.json')
          apps=json.loads(file.read_text()) if file.exists() else {}
          if os.environ['EVENT']=='workflow_dispatch':
              url=os.environ['URL'].strip()
              hostname=urlsplit(url).hostname
              if not hostname or not url.startswith('https://') or not re.fullmatch(r'[a-zA-Z0-9.-]+',hostname):
                  raise SystemExit('HTTPS URL with hostname required')
              app_id='.'.join(reversed(hostname.lower().split('.')))
              apps[app_id]={'name':os.environ['NAME'],'url':url,'image':os.environ['IMAGE']}
              file.write_text(json.dumps(apps,indent=2,ensure_ascii=False)+'\n')
          runners=[('macos-15','macos-arm64'),('windows-latest','windows-x64'),('ubuntu-24.04','linux-x64')]
          matrix=[{'id':id,**app,'os':runner,'target':target} for id,app in apps.items() for runner,target in runners]
          if not matrix: raise SystemExit('Register an app first')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n')
          PY
      - name: Save registry
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps.json
          if ! git diff --cached --quiet; then
            git commit -m 'Register desktop application'
            git push
          fi
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      APP_NAME: ${{ matrix.name }}
      APP_URL: ${{ matrix.url }}
      APP_ICON_URL: ${{ matrix.image }}
      APP_ID: ${{ matrix.id }}
      APP_VERSION: 1.2.${{ github.run_number }}
      UPDATE_BASE_URL: https://dipit-pt.github.io/DIPS-DESKTOP-GENERATOR/apps/${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
      - name: App settings
        shell: bash
        run: |
          node -e 'require("fs").writeFileSync("src/settings.ts",["APP_ID","APP_TITLE","APP_URL","APP_VERSION"].map(k=>"export const "+k+" = "+JSON.stringify(process.env[k])+";").join("\n"))'
        env:
          APP_TITLE: ${{ matrix.name }}
      - name: Icon
        shell: bash
        run: |
          python3 -m venv .icon-venv
          if [ -f .icon-venv/Scripts/python.exe ]; then
            PYTHON=.icon-venv/Scripts/python.exe
          else
            PYTHON=.icon-venv/bin/python
          fi
          "$PYTHON" -m pip install --quiet Pillow
          "$PYTHON" scripts/prepare-icon.py
      - name: Hutch for macOS
        if: runner.os == 'macOS'
        run: |
          brew install cmake
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
      - name: Hutch for Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libnotify-bin
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
      - name: Hutch for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://hutch.blackboard.sh/hutch/install.ps1)))
          Add-Content $env:GITHUB_PATH (Join-Path $HOME ".hutch\bin")
      - name: Build
        shell: bash
        run: hutch electrobun build --env=stable
      - name: Mac download
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-ready
          app="$(find build -type d -name '*.app' -print -prune | head -n 1)"
          codesign --force --deep --sign - "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" release-ready/macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.id }}-${{ matrix.target }}
          path: |
            release-ready/*.zip
            artifacts/**
            build/**/stable-*-update.json
            build/**/*.tar.zst
            build/**/*-Setup.zip
            build/**/*-Setup.tar.gz
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: [prepare,build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: downloads
      - name: Collect updates
        run: |
          python3 - <<'PY'
          import pathlib,shutil
          for folder in pathlib.Path('downloads').iterdir():
              if not folder.is_dir(): continue
              target=next((p for p in ('macos-arm64','windows-x64','linux-x64') if folder.name.endswith('-'+p)),None)
              if not target: raise SystemExit('Unknown artifact: '+folder.name)
              app_id=folder.name[len('desktop-'):-len(target)-1]
              files=[p for p in folder.rglob('*') if p.is_file() and (p.name.endswith('-update.json') or p.name.endswith('.tar.zst'))]
              if not any(p.name.endswith('-update.json') for p in files) or not any(p.name.endswith('.tar.zst') for p in files):
                  raise SystemExit('Missing updater files: '+folder.name)
              for file in files:
                  output=pathlib.Path('site/apps')/app_id/file.name
                  output.parent.mkdir(parents=True,exist_ok=True)
                  if output.exists(): raise SystemExit('Duplicate artifact: '+str(output))
                  shutil.copy2(file,output)
          PY
      # Keep a copy for inspection/recovery. A GITHUB_TOKEN push does not
      # trigger a Pages build; the explicit deployment below serves the files.
      - name: Save update branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q published
          cd published
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages
            git checkout -B gh-pages FETCH_HEAD
          else
            git checkout --orphan gh-pages
          fi
          mkdir -p apps
          cp -a ../site/apps/. apps/
          touch .nojekyll
          git add apps .nojekyll
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish desktop updates"
            git push origin gh-pages
          fi
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: [prepare,publish]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy updates
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public update feeds and bundles
        env:
          MATRIX: ${{ needs.prepare.outputs.matrix }}
          APP_VERSION: 1.2.${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json,os,time
          from urllib.parse import quote
          from urllib.request import Request,urlopen
          for app in json.loads(os.environ['MATRIX']):
              base='https://dipit-pt.github.io/DIPS-DESKTOP-GENERATOR/apps/'+app['id']+'/'
              # Matrix labels use "windows"; Electrobun's update protocol uses "win".
              update_target=app['target'].replace('windows-','win-',1)
              manifest_url=base+'stable-'+update_target+'-update.json'
              for attempt in range(12):
                  try:
                      with urlopen(manifest_url+'?run='+os.environ['GITHUB_RUN_ID'],timeout=30) as response:
                          manifest=json.load(response)
                      if manifest['version']!=os.environ['APP_VERSION']:
                          raise ValueError('Public feed still serves '+manifest['version'])
                      if manifest['identifier']!=app['id']:
                          raise ValueError('Unexpected app identifier')
                      artifact=base+quote(manifest['artifact']['file'],safe='')
                      with urlopen(Request(artifact,method='HEAD'),timeout=30) as response:
                          if response.status!=200: raise ValueError('Bundle is unavailable')
                      print('Verified',app['id'],app['target'],manifest['version'])
                      break
                  except Exception as error:
                      print('Verification failed:',manifest_url,'attempt',attempt+1,str(error),flush=True)
                      if attempt==11: raise
                      time.sleep(10)
          PY
